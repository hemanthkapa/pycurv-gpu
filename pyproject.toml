[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycurv-gpu"
version = "0.1.0"
description = "GPU (PyTorch) reimplementation of pycurv's tensor-voting curvature pipeline for cryo-ET membrane surfaces"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hemanth Kapa" }]
dependencies = [
    "torch>=2.0",
    "vtk>=9.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
# graph-tool has no pip wheel; install via conda:
#   conda install -c conda-forge graph-tool
# Only needed for --gt / write_gt=True output (default for the morphometrics plugin).
gt = []

[project.scripts]
pycurv-gpu = "run_gpu:main"

# Discovered by surface_morphometrics' LazyGroup when both packages share an env:
#   morphometrics pycurv_gpu config.yml [mesh.surface.vtp]
[project.entry-points."morphometrics.commands"]
pycurv_gpu = "morphometrics_plugin:pycurv_gpu"

[tool.setuptools]
py-modules = ["run_gpu", "benchmark_geodesic", "test_sphere", "morphometrics_plugin"]

[tool.setuptools.packages.find]
include = ["core*"]
